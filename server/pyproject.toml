[project]
name = "komori-mcp"
version = "0.1.0"
description = "Komori MCP server — Japan-equities disclosure research over the Model Context Protocol"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.26.0,<2",
    "httpx>=0.27",
    "keyring>=25.0",
]

[project.scripts]
komori-mcp = "komori_mcp.__main__:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["komori_mcp*"]
